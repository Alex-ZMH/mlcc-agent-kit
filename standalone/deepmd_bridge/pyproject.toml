[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlcc-deepmd-bridge"
version = "0.1.0"
description = "Standalone ABACUS label to DeePMD and LAMMPS engineering interface"
requires-python = ">=3.12"
dependencies = ["numpy", "ase"]

[project.scripts]
mlcc-deepmd = "mlcc_deepmd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
